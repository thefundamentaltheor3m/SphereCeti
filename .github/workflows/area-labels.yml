# Adds area labels from .github/labeler.yml to pull requests, including stacked ones.
# pull_request_target runs this workflow and its configuration from main, never from the PR, and
# nothing here checks out or runs PR code. The token can only read contents and edit PR labels.
name: Area labels

on:
  # No branch filter, so every PR in a stack is labelled; pull_request_target still runs this
  # workflow and its configuration from the default branch. `edited` reruns it after a retarget.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions: {}

jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          # Remove area labels that no longer match the current diff (labels not in labeler.yml are kept).
          sync-labels: true
