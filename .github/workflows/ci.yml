name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned Elan, Lean, and Mathlib cache
        run: bash scripts/install_lean.sh

      # Fetch Tau Ceti's cache map from its public Lake artifact service (the same pattern as
      # TauCetiRoadmap's CI; the read endpoints are anonymous and documented in TauCeti's
      # docs/cache-infrastructure.md). Artifacts stay lazy: the build downloads only the Tau Ceti
      # modules it actually imports. `--max-revs` lets a slightly earlier revision's cache map
      # serve when the exact pin has not published one; artifacts are content-addressed, so only
      # still-valid outputs are restored. A cache-service outage degrades to building from source.
      - name: Fetch Tau Ceti cache map
        id: tauceti_cache
        shell: bash
        run: |
          bash scripts/prepare_cache.sh

      - name: Check roadmap contracts
        run: python3 scripts/check_roadmap.py

      - name: Check module boundaries
        run: lake env python3 scripts/check_modules.py

      - name: Install same-tree Progress resources
        run: |
          python3 -m venv .venv
          .venv/bin/pip install .
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Run all unchanged Progress regressions offline
        run: python3 -I scripts/run_progress_tests.py

      - name: Test infrastructure and compiled audit regressions
        run: lake env python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Build and audit every classified source
        run: lake env python3 -I scripts/check_audits.py

      - name: Install pinned sandbox
        run: bash scripts/install_bwrap.sh

      - name: Exercise sandbox with a disposable Lean candidate
        run: python3 -I scripts/test_sandbox_smoke.py --toolchain "$(lean --print-prefix)"

      - name: Exercise advisory profiling on exact disposable revisions
        run: python3 -I scripts/test_profiling_smoke.py --toolchain "$(lean --print-prefix)"

      - name: Exercise complete immutable candidate pipeline with proposed tools
        run: python3 -I scripts/test_trusted_build_smoke.py --toolchain "$(lean --print-prefix)"

      # Keep degradation visible without turning a cache-service outage into a correctness failure.
      - name: Report Tau Ceti cache use
        if: ${{ always() && steps.tauceti_cache.outputs.enabled == '1' }}
        shell: bash
        run: |
          count=0
          if [ -d "$LAKE_CACHE_DIR/artifacts" ]; then
            count=$(find "$LAKE_CACHE_DIR/artifacts" -type f | wc -l)
          fi
          if [ "$count" -eq 0 ]; then
            echo "::warning::Tau Ceti cache map was found, but the build restored no artifacts"
          else
            echo "::notice::The build restored $count Tau Ceti artifact archive(s)"
          fi

  python-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install packaging tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install uv==0.10.4

      - name: Test inactive TauCetiReview import without external calls
        run: python3 -I scripts/run_review_tests.py

      - name: Check lock and build distributions
        run: |
          .venv/bin/uv lock --check
          .venv/bin/uv build

      - name: Test fresh wheel and source installations
        run: python3 scripts/test_package.py
