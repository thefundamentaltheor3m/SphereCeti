# Area labels for pull requests, applied by .github/workflows/area-labels.yml (actions/labeler).
# Labels describe a PR's purpose; these path rules give a first guess. Maintainers may adjust labels
# by hand, and the labeller never removes a label (sync-labels is off).

# Changes what we intend to prove: target statements, hypotheses, conventions, dependencies.
# UPSTREAM.md is not listed: proof PRs append upstream-candidate entries to it, which records where a
# proof should eventually go, not a change to what we intend to prove.
# A PR that also changes a Lean file under SphereCeti/ is a proof PR and gets area:proof-library only:
# proof PRs often update MIGRATION.md alongside the proof, which is not a roadmap change by itself.
area:roadmap:
- all:
  - changed-files:
    - any-glob-to-any-file:
      - 'SphereCetiRoadmap/**'
      - 'SphereCetiRoadmap.lean'
      - 'CONVENTIONS.md'
      - 'MIGRATION.md'
      - 'PROVENANCE.md'
    - all-globs-to-all-files:
      - '!SphereCeti/**/*.lean'

# Implements mathematics in the SphereCeti/ library: definitions, lemmas, proofs.
# A changed Lean file in the library other than the bootstrap module SphereCeti/Basic.lean.
area:proof-library:
- changed-files:
  - all-globs-to-any-file:
    - 'SphereCeti/**/*.lean'
    - '!SphereCeti/Basic.lean'

# Changes how we build, test, review or contribute: CLI, CI, audits, workers, tooling.
area:infrastructure:
- changed-files:
  - any-glob-to-any-file:
    - '.github/**'
    - 'tools/**'
    - 'scripts/**'
    - 'tests/**'
    - 'docs/infrastructure/**'
    - 'policy/**'
    - 'lakefile.toml'
    - 'lake-manifest.json'
    - 'lean-toolchain'
    - 'pyproject.toml'
    - 'uv.lock'
    - 'sphereceti.toml'
