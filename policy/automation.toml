# Repository-owned policy, never loaded from an operator preferences file.
schema_version = 1
review_generation = true
posting = true
authoring = false
reporting = false
# Formal GitHub approvals by opted-in maintainers' own all-green reviews (`sphereceti review N`
# approves only after every guard passes; `--no-approve` opts out for one run).
approving = true
# The single global merging stop switch (docs/infrastructure/activation.md). Setting it to false
# stops new merge attempts at the next controller run.
merging = true
# Paths eligible for the automatic route. Prefix semantics as in gate.py: any library module
# (`.lean` file) under SphereCeti/. Topics are not enumerated because new topic directories appear
# constantly; open PRs touch NumberTheory, Analysis, E8, Contour, Leech, Lattice, ZLattice,
# CohnElkies, MeasureTheory, Topology and Algebra. Still routed to a human:
# - the gate's protected files SphereCeti/Basic.lean, SphereCeti/Pinned.lean and SphereCeti/Suggested.lean;
# - the frozen library root SphereCeti.lean, and the roadmap specification (README.md, SphereCetiRoadmap/);
# - any change mixed with CI, policy, dependency, tooling or script paths.
# Only fully qualifying PRs, formally approved by an opted-in maintainer, can merge.
mathematical_paths = ["SphereCeti/"]
# Reviewers whose posted review records count as official (immutable GitHub user ids, verified
# read-only on 2026-11-24 with `gh api users/<login>` and the repository collaborator list).
# Authorization covers review records only: it grants no merge authority, and a reviewer's record
# never counts as independent on their own PR. Formal GitHub approvals by `sphereceti review` are
# a separate opt-in (approving_reviewers, below).
# Ids: 2009342 cameronfreer (maintainer; first canary 2026-11-22), 56166236 CBirkbeck (maintainer),
# 64404030 thefundamentaltheor3m (repository admin), 29959226 b-mehta (maintainer), 49933279 seewoo5
# (maintainer), 117926300 viazovska (maintainer), 6530144 arajasek (contributor).
authorized_reviewers = ["user:2009342", "user:56166236", "user:64404030", "user:29959226", "user:49933279", "user:117926300", "user:6530144"]
# Future authorization uses immutable GitHub identities: "user:12345" or "app:12345".
# Maintainers (a subset of authorized_reviewers, as "user:ID") whose all-green `sphereceti review`
# also submits a formal GitHub APPROVE under their own account, which can lead to an automatic
# merge. Each opted in on 2026-11-25 (confirmed by the maintainer); `--no-approve` opts out for one
# run. Ids: 2009342 cameronfreer, 56166236 CBirkbeck, 64404030 thefundamentaltheor3m, 29959226
# b-mehta, 49933279 seewoo5, 117926300 viazovska, 6530144 arajasek. Later reviewers are added in
# one-line policy PRs as each explicitly opts in.
approving_reviewers = ["user:2009342", "user:56166236", "user:64404030", "user:29959226", "user:49933279", "user:117926300", "user:6530144"]
