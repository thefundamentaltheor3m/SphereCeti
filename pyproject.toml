[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sphereceti"
version = "0.1.0"
description = "SphereCeti project diagnostics and TauCeti infrastructure adapters"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "SphereCeti contributors"}]
dependencies = []

[project.scripts]
sphereceti = "sphereceti.cli:main"

[project.urls]
Repository = "https://github.com/thefundamentaltheor3m/SphereCeti"
"Upstream infrastructure" = "https://github.com/TauCetiProject/TauCeti"

[tool.hatch.build.targets.wheel]
packages = ["tools/project/sphereceti"]

[tool.hatch.build.targets.wheel.force-include]
"policy/archive.toml" = "sphereceti/resources/archive.toml"
"sphereceti.toml" = "sphereceti/resources/sphereceti.toml"
"policy/automation.toml" = "sphereceti/resources/automation.toml"
"policy/reporting.toml" = "sphereceti/resources/reporting.toml"
"policy/merge-checks.toml" = "sphereceti/resources/merge-checks.toml"
"tools/upstream-lock.toml" = "sphereceti/resources/upstream-lock.toml"
"tools/review/runner" = "sphereceti/resources/review/runner"
"tools/review/rubrics" = "sphereceti/resources/review/rubrics"
"tools/review/project" = "sphereceti/resources/review/project"
"tools/review/LICENSE" = "sphereceti/resources/review/LICENSE"
"tools/review/import-manifest.json" = "sphereceti/resources/review/import-manifest.json"

"tools/progress/progress" = "sphereceti/resources/progress/progress"
"tools/progress/tests" = "sphereceti/resources/progress/tests"
"tools/progress/fixtures" = "sphereceti/resources/progress/fixtures"
"tools/progress/LICENSE" = "sphereceti/resources/progress/LICENSE"
"tools/progress/UPSTREAM-README.md" = "sphereceti/resources/progress/UPSTREAM-README.md"
"tools/progress/upstream-pyproject.toml" = "sphereceti/resources/progress/upstream-pyproject.toml"
"tools/progress/import-manifest.json" = "sphereceti/resources/progress/import-manifest.json"

[tool.hatch.build.targets.sdist]
"include" = ["policy/archive.toml", "tools/project/sphereceti", "tools/review/runner", "tools/review/rubrics", "tools/review/project", "tools/review/LICENSE", "tools/review/import-manifest.json", "sphereceti.toml", "policy/automation.toml", "tools/upstream-lock.toml", "README.md", "LICENSE", "pyproject.toml", "tools/progress", "policy/reporting.toml", "policy/merge-checks.toml"]
