name = "SphereCeti"
defaultTargets = ["SphereCeti", "SphereCetiRoadmap"]

# SphereCeti is a roadmap/prototype library. The TauCeti dependency is deliberately
# pinned to a full commit, rather than tracking `main`, because Suggested.lean is an
# API contract against that snapshot.
[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "8671bee98125933c56b9b00a08ded873b77dd23b"

[[lean_lib]]
name = "SphereCeti"
globs = ["SphereCeti.*"]

# Roadmap admissions belong to this separately checked library, never SphereCeti.
[[lean_lib]]
name = "SphereCetiRoadmap"
globs = ["SphereCetiRoadmap.*"]
