license_status = "recorded"
adaptation = "PR #9 imports the engine, ten rubrics, references, tests, and license with inactive legacy launchers. The local advisory adapter supplies exact Git evidence, installed resources, explicit project overlays, isolated provider dispatch, and shared budget accounting. Original import mapping: tools/review/import-manifest.json; integration: docs/infrastructure/local-review.md. The record/posting adapter adds strict evidence envelopes, GitHub user/App identity checks, per-publisher supersession, contests, and explicit policy-gated publication. The archive adapter uses runner/archive.py, runner/review.py, and runner/post.py for private run capture, an immutable local journal/outbox, confirmed append-only GitHub sync, and an independently authored derived SQLite schema. The evaluation adapter uses runner/costs.py, runner/pricing.py, runner/prices.json, runner/cli.py and runner/review.py for dated cost analysis and isolated shadow comparisons, with independently authored local human labels and explicit shadow allowances. No TauCetiData sources are copied. The independent Worker adapter invokes this same engine under approved-policy, exact-source and cooperative-lease guards; operational receipts remain separate from accepted records. Original legacy launchers stay disabled. The shared merge-observation adapter reuses authenticated records and trusted scope, verifies status producers against exact Actions run attempts, and reports eligibility without merging or queueing. The controller adapts the pinned merge-only/merge-sweep workflows with one serialized executor, expected-head squash requests, protected non-bypass identity checks, a shared stop switch, and live restart reconciliation; the workflow remains an inactive template."

